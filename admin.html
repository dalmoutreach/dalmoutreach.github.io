<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Dashboard · Give Back Project</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101a30">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a30'/%3E%3Cpath d='M32 50S12 38 12 24a10 10 0 0 1 20-3 10 10 0 0 1 20 3c0 14-20 26-20 26z' fill='%23e8a33d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 33S6 25 6 15.5a7 7 0 0 1 14-2 7 7 0 0 1 14 2C34 25 20 33 20 33z" fill="var(--amber)"/></svg>
        <span class="brand-text">Give Back <span>Team</span></span>
      </a>
      <div class="header-tools">
        <span class="who" id="who" hidden></span>
        <div class="textsize" role="group" aria-label="Text size">
          <button type="button" data-size="1" aria-label="Normal text">A</button>
          <button type="button" data-size="2" aria-label="Larger text">A</button>
          <button type="button" data-size="3" aria-label="Largest text">A</button>
        </div>
        <button class="hdr-btn" type="button" id="sign-out" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Sign in -->
    <section class="login" id="login-view">
      <div class="login-card">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
        <h1>Team sign in</h1>
        <p>For Dimension Abundant Life Ministries team members. See and respond to every request that comes in through the website.</p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-name">Your name</label>
            <input id="login-name" type="text" autocomplete="name" placeholder="So notes show who wrote them" required>
          </div>
          <div class="field">
            <label for="login-password">Team password</label>
            <input id="login-password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-big" type="submit">Sign in</button>
          <p class="status" id="login-status" role="status" aria-live="polite"></p>
        </form>
        <p class="demo-line">New to the dashboard? <button type="button" class="link-btn" id="demo-btn">Try it with sample requests</button></p>
      </div>
    </section>

    <!-- Dashboard -->
    <section class="dash" id="dash-view" hidden>
      <div class="wrap">
        <div class="demo-banner" id="demo-banner" hidden>Demo mode: these are made-up sample requests for practice. Nothing you do here is saved. <button type="button" class="link-btn" id="demo-exit">Leave demo</button></div>

        <div class="dash-top">
          <div>
            <h1>Requests</h1>
            <p class="updated" id="updated"></p>
          </div>
          <div class="dash-actions">
            <button type="button" class="tool-btn" id="refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span> Refresh</span></button>
            <button type="button" class="tool-btn" id="export"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span> Export spreadsheet</span></button>
          </div>
        </div>

        <div class="stats-row" id="stats"></div>

        <div class="tabs" role="tablist" id="tabs"></div>

        <div class="filters">
          <input type="search" id="f-search" placeholder="Search names, towns, phone, details…" aria-label="Search requests">
          <select id="f-status" aria-label="Status"></select>
          <select id="f-assigned" aria-label="Assigned to"></select>
          <select id="f-sort" aria-label="Sort">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="updated">Recently updated</option>
          </select>
        </div>

        <p class="count" id="count" aria-live="polite"></p>
        <div class="list" id="list"></div>
      </div>
    </section>

    <!-- Detail drawer -->
    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" aria-labelledby="d-name" role="dialog" aria-modal="true" hidden tabindex="-1">
      <div class="drawer-head">
        <div>
          <p class="d-meta" id="d-meta"></p>
          <h2 id="d-name"></h2>
        </div>
        <button type="button" class="close-btn" id="d-close" aria-label="Close">✕</button>
      </div>
      <div class="drawer-body">
        <div class="quick" id="d-quick"></div>
        <dl class="facts" id="d-facts"></dl>

        <div class="d-block">
          <h3>Status</h3>
          <div class="status-pick" id="d-status" role="group" aria-label="Status"></div>
        </div>

        <div class="d-block">
          <h3><label for="d-assign">Assigned to</label></h3>
          <div class="assign-row">
            <input id="d-assign" list="team-names" placeholder="Volunteer's name">
            <button type="button" class="btn btn-small" id="d-assign-save">Save</button>
            <button type="button" class="link-btn" id="d-assign-me">Assign to me</button>
          </div>
          <datalist id="team-names"></datalist>
        </div>

        <div class="d-block">
          <h3><label for="d-note">Add a note</label></h3>
          <textarea id="d-note" rows="3" placeholder="e.g. Called Tuesday, visiting Saturday at 10 am to set up her iPad"></textarea>
          <button type="button" class="btn btn-small" id="d-note-save">Add note</button>
        </div>

        <div class="d-block">
          <h3>Activity</h3>
          <ol class="timeline-list" id="d-activity"></ol>
        </div>

        <div class="d-tools">
          <button type="button" class="tool-btn" id="d-copy"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span> Copy summary for a volunteer</span></button>
          <button type="button" class="tool-btn" id="d-print"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg><span> Print</span></button>
        </div>
        <p class="status" id="d-status-msg" role="status" aria-live="polite"></p>
      </div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="script.js"></script>
  <script src="admin.js"></script>
</body>
</html>
